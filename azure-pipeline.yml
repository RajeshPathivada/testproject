trigger:
- main

pool:
  name: local-windows-agent

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: 'Install Node.js'

- script: |
    npm install
    npx playwright install
  displayName: 'Install dependencies'

- script: |
    npx playwright test --workers=1
  displayName: 'Run Playwright tests'
